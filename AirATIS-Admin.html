<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;
  --ink:#1c3d6e;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;--ink-body:#3a2f22;
  --gold:#c8a04a;--gold-lite:#d4b878;
  --cleared:#1f6f3f;--amber:#f59e0b;--stamp-red:#b94a3a;
  --font-ui:'IBM Plex Sans Hebrew',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{background:var(--paper);font-family:var(--font-ui);height:100svh;overflow:hidden;display:flex;flex-direction:column;}
.topfixed{flex-shrink:0;background:var(--paper);}
.header{background:var(--ink);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:calc(58px + env(safe-area-inset-top));}
.hdr-rail{display:flex;align-items:center;gap:10px;min-width:0;}
.hdr-glyph{width:38px;height:38px;flex:0 0 38px;border-radius:9px;overflow:hidden;border:1px solid var(--gold);background:var(--paper);}
.hdr-glyph img{width:100%;height:100%;display:block;object-fit:cover}
.hdr-title h1{font-size:16.5px;line-height:1.25;font-weight:700;letter-spacing:-.1px;color:#f4ecdc;}
.hdr-title p{color:var(--gold-lite);font-weight:500;margin-top:1px;line-height:1.3;font-size:10.5px;}
.hdr-link{flex:0 0 auto;font-family:var(--font-mono);font-size:10px;color:var(--gold-lite);text-decoration:none;border:1px solid var(--gold-lite);border-radius:5px;padding:7px 9px;white-space:nowrap;}
.hdr-link:active{background:rgba(200,160,74,.15);}
.headline{padding:14px 18px 6px;display:flex;justify-content:center;gap:28px;direction:ltr;}
.headline-item{display:flex;flex-direction:column;align-items:center;gap:0;}
.headline-num{font-family:var(--font-mono);font-size:34px;font-weight:700;color:var(--ink);line-height:1.1;}
.headline-num.gold{color:var(--gold);}
.headline-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-muted);}
.content{padding:14px 16px 24px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}
.section{margin-bottom:16px;}
.section-title{font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;}
.section-box{background:#fff;border:1px solid var(--paper-edge);border-radius:6px;padding:10px 12px;}
.bar-row{margin-bottom:10px;}
.bar-row:last-child{margin-bottom:0;}
.bar-labels{display:flex;justify-content:space-between;font-size:10px;font-family:var(--font-mono);color:var(--ink-muted);margin-bottom:3px;}
.bar-labels .lbl{color:var(--ink-body);font-weight:700;}
.bar-track{position:relative;height:8px;background:var(--paper-edge);border-radius:4px;overflow:hidden;}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;}
.loading{text-align:center;padding:40px 20px;color:var(--ink-muted);font-size:13px;}
.loading.err{color:var(--stamp-red);font-family:var(--font-mono);font-size:11px;line-height:1.6;}
.icon-refresh{display:inline-flex;align-items:center;gap:5px;cursor:pointer;}
.icon-refresh .refresh-glyph{font-size:13px;color:var(--ink-muted);}
.icon-refresh:active .refresh-glyph{opacity:.5;}
.icon-refresh.spinning .refresh-glyph{animation:refreshSpin .6s linear;}
@keyframes refreshSpin{0%{opacity:1;}50%{opacity:.5;}100%{opacity:1;}}
.dev-legend{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);margin-bottom:8px;}
.group{background:#fff;border:1px solid var(--paper-edge);border-radius:6px;margin-bottom:10px;overflow:hidden;}
.group-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;cursor:pointer;background:var(--paper-hi);}
.group-hdr-left{display:flex;align-items:center;gap:8px;}
.group-name{font-size:12px;font-weight:700;color:var(--ink);}
.group-count{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);}
.group-chevron{font-size:10px;color:var(--ink-faint);transition:transform .15s;}
.group.open .group-chevron{transform:rotate(90deg);}
.group-body{display:none;}
.group.open .group-body{display:block;}
.dev-header,.dev-row{display:grid;grid-template-columns:22px 26px 1fr 40px 100px 64px;align-items:center;gap:6px;padding:0 12px;min-height:34px;}
.dev-header{background:var(--paper-hi);border-bottom:1px solid var(--paper-edge);min-height:24px;}
.dev-header span{font-family:var(--font-mono);font-size:8px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
.dev-row{border-top:1px solid var(--paper-edge);cursor:pointer;}
.col-os,.col-pwa{text-align:center;}
.col-id{text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.col-active,.col-ver,.col-cnt{text-align:right;}
.dev-id{font-family:var(--font-mono);font-size:11px;color:var(--ink);}
.dev-os{font-size:12px;}
.dev-pwa{font-size:10px;}
.dev-active{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);}
.dev-ver{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);white-space:nowrap;}
.dev-cnt{font-family:var(--font-mono);font-size:11px;color:var(--ink);}
.dev-cnt .done{color:var(--gold);font-weight:700;}
.dev-detail{display:none;padding:8px 12px 10px;border-top:1px dashed var(--paper-edge);background:var(--paper);}
.dev-row.open + .dev-detail{display:block;}
.dev-detail-row{display:flex;justify-content:space-between;font-size:10px;font-family:var(--font-mono);padding:2px 0;}
.dev-detail-row .lbl{color:var(--ink-faint);font-family:var(--font-ui);}
.stale-flag{display:inline-block;font-size:8px;font-family:var(--font-mono);background:rgba(185,74,58,.12);color:var(--stamp-red);padding:0 4px;border-radius:3px;margin-right:3px;white-space:nowrap;}
.range-pills{display:flex;gap:6px;margin-bottom:8px;}
.range-pill{flex:1;padding:6px 4px;background:transparent;border:1px solid var(--gold-lite);border-radius:5px;font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);cursor:pointer;}
.range-pill.active{background:var(--ink);border-color:var(--ink);color:#f4ecdc;font-weight:700;}
.range-custom{display:none;align-items:center;gap:6px;margin-bottom:8px;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);}
.range-custom.open{display:flex;}
.range-custom select{flex:1;min-width:0;padding:5px 4px;background:#fff;border:1px solid var(--paper-edge);border-radius:5px;font-family:var(--font-mono);font-size:11px;color:var(--ink);}
.range-sum{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-bottom:6px;}
.empty{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);background:var(--paper);border:1px dashed var(--gold-lite);border-radius:8px;padding:20px 14px;text-align:center;line-height:1.6;}
@media(min-width:600px){
  html{background:#1a1a1c;}
  body{max-width:430px;margin:0 auto;border-left:2px solid var(--gold);border-right:2px solid var(--gold);box-shadow:0 0 60px rgba(0,0,0,.6);}
}
</style>
</head>

  <span class="icon-refresh" id="footerRefreshBtn" onclick="refreshStats()">
    <span class="refresh-glyph">&#8635;</span>
    <span id="lastUpdateLabel" style="font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.04em;white-space:nowrap;">-</span>
  </span>
  <span style="position:absolute;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;">AIRATIS_ADMIN · v1.01 · built by eligrt</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// Data: airatis/devices in the same Firebase project as AirCheck (read with the REST API, no SDK).
// Per device: os, pwaInstalled, appVersion, lastSeen, lastOpenedAt, started, done, lastStartedAt, lastDoneAt,
//             daily/{YYYY-MM-DD}/{s,d}, ap/{ICAO}/{s,d}
const DB_URL='https://aircheck-80530-default-rtdb.europe-west1.firebasedatabase.app/airatis/devices.json';
const AP_ORDER=['LLIB','LLHA','LLER','LLBG','OTHER'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(v){const n=Number(v);return isFinite(n)&&n>0?Math.floor(n):0;}
function pad(n){return String(n).padStart(2,'0');}
function parseVerNums(v){return (v||'').match(/\d+/g)?.map(Number)||[0];}
function compareVersions(a,b){
  const na=parseVerNums(a),nb=parseVerNums(b);
  for(let i=0;i<Math.max(na.length,nb.length);i++){const d=(na[i]||0)-(nb[i]||0);if(d!==0)return d;}
  return 0;
}
function osIcon(os){if(os==='iOS')return'🍎';if(os==='Android')return'📱';return'🖥️';}
function timeAgoShort(ts){
  if(!ts)return'-';
  const diff=Date.now()-ts;
  if(diff<3600000)return Math.max(1,Math.round(diff/60000))+'m';
  if(diff<86400000)return Math.round(diff/3600000)+'h';
  return Math.round(diff/86400000)+'d';
}
function fmtDT(ts){
  if(!ts)return'-';
  return new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}

// ── Devices, grouped by recency (same groups as the AirCheck admin) ──
function buildRecencyGroups(entries,latest){
  const now=Date.now(),D=86400000;
  const buckets=[
    {name:'Last 24h',test:d=>now-(d.lastSeen||0)<D},
    {name:'Last 7 days',test:d=>now-(d.lastSeen||0)>=D&&now-(d.lastSeen||0)<7*D},
    {name:'Last 30 days',test:d=>now-(d.lastSeen||0)>=7*D&&now-(d.lastSeen||0)<30*D},
    {name:'Older',test:d=>now-(d.lastSeen||0)>=30*D}
  ];
  const sorted=[...entries].sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  return buckets.map((b,i)=>{
    const items=sorted.filter(b.test);
    if(!items.length)return'';
    const rows=items.map(d=>{
      const stale=d.appVersion&&compareVersions(d.appVersion,latest)!==0;
      return `
        <div class="dev-row" onclick="this.classList.toggle('open')">
          <span class="dev-os col-os">${osIcon(d.os)}</span>
          <span class="dev-pwa col-pwa">${d.pwaInstalled?'📲':'-'}</span>
          <span class="dev-id col-id">${esc(d.id)}</span>
          <span class="dev-active col-active">${timeAgoShort(d.lastSeen)}</span>
          <span class="dev-ver col-ver">${stale?'<span class="stale-flag">!</span>':''}${esc(d.appVersion||'-')}</span>
          <span class="dev-cnt col-cnt">${num(d.started)}/<span class="done">${num(d.done)}</span></span>
        </div>
        <div class="dev-detail">
          <div class="dev-detail-row"><span class="lbl">Last opened</span><span>${fmtDT(d.lastOpenedAt)}</span></div>
          <div class="dev-detail-row"><span class="lbl">Last ATIS started</span><span>${fmtDT(d.lastStartedAt)}</span></div>
          <div class="dev-detail-row"><span class="lbl">Last ATIS done</span><span>${fmtDT(d.lastDoneAt)}</span></div>
        </div>`;
    }).join('');
    return `<div class="group${i===0?' open':''}">
      <div class="group-hdr" onclick="this.parentElement.classList.toggle('open')">
        <div class="group-hdr-left"><span class="group-name">${b.name}</span><span class="group-count">${items.length}</span></div>
        <span class="group-chevron">&#9654;</span>
      </div>
      <div class="group-body">
        <div class="dev-header">
          <span class="col-os"></span><span class="col-pwa">PWA</span><span class="col-id">DEVICE</span><span class="col-active">ACTIVE</span><span class="col-ver">VERSION</span><span class="col-cnt">START/DONE</span>
        </div>
        ${rows}
      </div>
    </div>`;
  }).join('');
}

// ── Weeks (Israel week, starts Sunday), continuous from the first tracked week to this week ──
function buildWeeks(entries){
  const map={};
  entries.forEach(d=>{
    const dl=d.daily;
    if(!dl||typeof dl!=='object')return;
    Object.entries(dl).forEach(([day,v])=>{
      const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(day);
      if(!m||!v||typeof v!=='object')return;
      const dt=new Date(+m[1],+m[2]-1,+m[3]);
      const sun=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()-dt.getDay());
      const key=sun.getFullYear()+'-'+pad(sun.getMonth()+1)+'-'+pad(sun.getDate());
      const w=map[key]||(map[key]={s:0,d:0,ms:sun.getTime()});
      w.s+=num(v.s);w.d+=num(v.d);
    });
  });
  const keys=Object.keys(map).sort();
  if(!keys.length)return[];
  const first=new Date(map[keys[0]].ms);
  const now=new Date(),cur=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay());
  const out=[];
  for(let s=new Date(first.getFullYear(),first.getMonth(),first.getDate());s<=cur;s=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7)){
    const key=s.getFullYear()+'-'+pad(s.getMonth()+1)+'-'+pad(s.getDate());
    const w=map[key]||{s:0,d:0};
    out.push({label:MON[s.getMonth()]+' '+s.getDate(),full:MON[s.getMonth()]+' '+s.getDate()+', '+s.getFullYear(),s:w.s,d:w.d});
  }
  return out;
}

function barRow(label,started,done,max){
  const ps=max>0?Math.round(started/max*100):0,pd=max>0?Math.round(done/max*100):0;
  return `<div class="bar-row">
    <div class="bar-labels"><span class="lbl">${esc(label)}</span><span>${started} started &middot; ${done} done</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${ps}%;background:var(--ink);"></div><div class="bar-fill" style="width:${pd}%;background:var(--gold);"></div></div>
  </div>`;
}

function renderAll(data){
  const entries=Object.entries(data||{}).filter(([k,p])=>p&&typeof p==='object').map(([id,p])=>({id,...p}));
  const box=document.getElementById('content');
  if(!entries.length){
    document.getElementById('headline').style.display='none';
    box.innerHTML='<div class="empty">No data yet.<br>Devices appear here after they open the updated AirATIS.</div>';
    return;
  }
  const started=entries.reduce((a,d)=>a+num(d.started),0);
  const done=entries.reduce((a,d)=>a+num(d.done),0);
  document.getElementById('hlDevices').textContent=entries.length;
  document.getElementById('hlStarted').textContent=started;
  document.getElementById('hlDone').textContent=done;
  document.getElementById('headline').style.display='flex';

  // airfields
  const ap={};
  entries.forEach(d=>{
    if(!d.ap||typeof d.ap!=='object')return;
    Object.entries(d.ap).forEach(([k,v])=>{
      if(!v||typeof v!=='object')return;
      const a=ap[k]||(ap[k]={s:0,d:0});a.s+=num(v.s);a.d+=num(v.d);
    });
  });
  const keys=Object.keys(ap).sort((a,b)=>{
    const ia=AP_ORDER.indexOf(a),ib=AP_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);
  });
  const maxS=keys.reduce((m,k)=>Math.max(m,ap[k].s),0);
  const apHtml=keys.length?keys.map(k=>barRow(k,ap[k].s,ap[k].d,maxS)).join(''):'<div class="empty">No airfield data yet.</div>';

  // devices
  const verCounts={};
  entries.forEach(d=>{if(d.appVersion)verCounts[d.appVersion]=1;});
  const latest=Object.keys(verCounts).sort((a,b)=>compareVersions(b,a))[0]||'';

  window._weeks=buildWeeks(entries);
  const hasWeeks=window._weeks.length>0;
  const weekly=hasWeeks?`
    <div class="range-pills">
      <button class="range-pill" data-r="4" onclick="setTrendRange('4')">4 WEEKS</button>
      <button class="range-pill" data-r="12" onclick="setTrendRange('12')">12 WEEKS</button>
      <button class="range-pill" data-r="custom" onclick="setTrendRange('custom')">CUSTOM</button>
    </div>
    <div class="range-custom" id="trendCustom">
      <span>FROM</span><select id="trendFrom" onchange="onTrendCustom()"></select>
      <span>TO</span><select id="trendTo" onchange="onTrendCustom()"></select>
    </div>
    <div class="range-sum" id="trendSum"></div>
    <div style="position:relative;width:100%;height:200px;"><canvas id="usageTrend"></canvas></div>`
    :'<div class="empty">The weekly chart appears once the first ATIS is started.</div>';

  box.innerHTML=`
    <div class="section"><div class="section-title">WEEKLY - ATIS STARTED VS DONE</div><div class="section-box">${weekly}</div></div>
    <div class="section"><div class="section-title">BY AIRFIELD</div><div class="section-box">${apHtml}</div></div>
    <div class="section"><div class="section-title">DEVICES</div>
      <div class="dev-legend">Counts = started / done. Red "!" = not on the latest version${latest?' ('+esc(latest)+')':''}.</div>
      ${buildRecencyGroups(entries,latest)}
    </div>`;
  drawTrend();
}

// ── Trend range: '4' | '12' | 'custom' (from/to = indexes into the week list) ──
let _trendRange='4',_trendFrom=null,_trendTo=null,_trendChart=null;
function setTrendRange(r){_trendRange=r;drawTrend();}
function onTrendCustom(){
  _trendFrom=parseInt(document.getElementById('trendFrom').value,10);
  _trendTo=parseInt(document.getElementById('trendTo').value,10);
  drawTrend();
}
function drawTrend(){
  const el=document.getElementById('usageTrend');
  const all=window._weeks||[],n=all.length;
  if(!el||!n)return;
  if(_trendFrom===null||_trendTo===null||_trendTo>=n||_trendFrom>=n){_trendTo=n-1;_trendFrom=Math.max(0,n-8);}
  let a,b;
  if(_trendRange==='custom'){a=Math.min(_trendFrom,_trendTo);b=Math.max(_trendFrom,_trendTo);}
  else{b=n-1;a=Math.max(0,n-parseInt(_trendRange,10));}
  const slice=all.slice(a,b+1);
  document.querySelectorAll('.range-pill').forEach(p=>p.classList.toggle('active',p.dataset.r===_trendRange));
  const cw=document.getElementById('trendCustom');
  if(cw)cw.classList.toggle('open',_trendRange==='custom');
  const opts=all.map((w,i)=>`<option value="${i}">${w.full}</option>`).join('');
  const fs=document.getElementById('trendFrom'),ts=document.getElementById('trendTo');
  if(fs&&ts){fs.innerHTML=opts;ts.innerHTML=opts;fs.value=String(a);ts.value=String(b);}
  const sumS=slice.reduce((x,w)=>x+w.s,0),sumD=slice.reduce((x,w)=>x+w.d,0);
  const sum=document.getElementById('trendSum');
  if(sum)sum.textContent=`${all[a].full} - ${all[b].full} · ${slice.length} weeks · ${sumS} started · ${sumD} done${sumS?' ('+Math.round(sumD/sumS*100)+'%)':''}`+(_trendRange!=='custom'&&slice.length<parseInt(_trendRange,10)?' (tracking started later)':'');
  if(_trendChart){try{_trendChart.destroy();}catch(e){}_trendChart=null;}
  if(typeof Chart==='undefined'){el.parentNode.innerHTML='<div class="empty">The chart library could not load (no internet?).</div>';return;}
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const ink=css('--ink')||'#1c3d6e',gold=css('--gold')||'#c8a04a',faint=css('--ink-faint')||'#8a7a5a';
  const dense=slice.length>16;
  const topLabels={id:'topLabels',afterDatasetsDraw:function(c){
    if(dense)return;
    const ctx=c.ctx;ctx.save();ctx.font='600 10px sans-serif';ctx.textAlign='center';
    c.data.datasets.forEach((ds,di)=>{
      ctx.fillStyle=di===0?ink:'#8a6a1f';
      c.getDatasetMeta(di).data.forEach((bar,i)=>{if(ds.data[i]>0)ctx.fillText(ds.data[i],bar.x,bar.y-4);});
    });
    ctx.restore();
  }};
  _trendChart=new Chart(el,{
    type:'bar',
    data:{labels:slice.map(w=>w.label),datasets:[
      {label:'started',data:slice.map(w=>w.s),backgroundColor:ink,borderRadius:2},
      {label:'done',data:slice.map(w=>w.d),backgroundColor:gold,borderRadius:2}
    ]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:16}},
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,boxHeight:10,font:{size:11},color:faint}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:11},color:faint,autoSkip:true,maxRotation:0}},
        y:{grid:{color:'rgba(120,120,110,0.15)'},ticks:{font:{size:11},color:faint,precision:0},beginAtZero:true}}},
    plugins:[topLabels]
  });
}

function updateLastUpdateLabel(){
  const el=document.getElementById('lastUpdateLabel');
  if(!el)return;
  const now=new Date();
  el.textContent=pad(now.getHours())+':'+pad(now.getMinutes());
}
async function loadStats(){
  const box=document.getElementById('content');
  try{
    const r=await fetch(DB_URL+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status===401?'Permission denied - check the Firebase rules for airatis/':'HTTP '+r.status);
    const data=await r.json();
    updateLastUpdateLabel();
    renderAll(data||{});
  }catch(e){
    box.innerHTML='<div class="loading err">Could not load data.<br>'+esc(e.message||e)+'</div>';
  }
}
function refreshStats(){
  const btn=document.getElementById('footerRefreshBtn');
  btn.classList.add('spinning');
  setTimeout(()=>btn.classList.remove('spinning'),600);
  loadStats();
}
loadStats();
</script>
</body>
</html>
